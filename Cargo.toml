[package]
name = "qompas"
version = "0.1.0"
edition = "2021"
description = "Quantum exploration library — simulate and visualize quantum circuits with GPU acceleration"
license = "MIT"

[dependencies]
# GPU-accelerated rendering
blade-graphics = "0.8.4"
blade-egui = "0.8.1"
blade-macros = "0.3"
egui = "0.34"
egui-winit = "0.34"
# Serialization helpers for shader data
bytemuck = { version = "1", features = ["derive"] }
mint = "0.5"
num-complex = "0.4"
# Circuit format parsing (OpenQASM)
nom = "7"
# Windowing
winit = "0.30"
# Logging
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
approx = "0.5"
